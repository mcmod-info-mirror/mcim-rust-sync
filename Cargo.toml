[package]
name = "mcim-rust-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
backon = "1.6.0"
bson = { version = "3.1.0", features = ["chrono-0_4", "serde_with-3", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
governor = "0.10.4"
mongodb = { version = "3.8.1", features = ["bson-3"] }
redis = { version = "1.6.0", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = { version = "3.22.0", features = ["chrono_0_4"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
