name: "Docker build"

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docker_build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
  
      - name: Build Rust Binary
        run: | 
          cargo build --release --verbose --bin mcim-rust-sync
          cargo build --verbose --bin mcim-rust-sync
          mkdir -p build_output
          cp target/release/mcim-rust-sync build_output/mcim-rust-sync
          cp target/debug/mcim-rust-sync build_output/mcim-rust-sync-debug
  
      - name: Upload Rust Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build_output/
  
      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 同时配置 Docker Hub 和 GHCR 的镜像
          images: |
            ${{ vars.DOCKER_USERNAME }}/mcim-rust-sync
            ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short,prefix=
            latest
  
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
  
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
  
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
