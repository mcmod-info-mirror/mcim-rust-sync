services:
  mcim_rust_sync:
    container_name: mcim_rust_sync
    image: mcim_rust_sync
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: always
    network_mode: host

    # 必须大于 SHUTDOWN_GRACE_SECS，否则 docker stop 会在缺省的 10 秒后强制杀掉进程，导致无法正常退出
    stop_grace_period: 70s

    environment:
      TZ: Asia/Shanghai
      RUST_LOG: mcim_rust_sync=info,warn

      MONGODB_HOST: localhost
      MONGODB_PORT: 27017
      MONGODB_AUTH: true
      MONGODB_USER: ${MONGODB_USER:?}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:?}
      MONGODB_DATABASE: mcim_backend

      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      REDIS_DATABASE: 0

      MAX_WORKERS: 8
      CURSEFORGE_CHUNK_SIZE: 1000
      MODRINTH_CHUNK_SIZE: 100

      SHUTDOWN_GRACE_SECS: 60

      CURSEFORGE_API_KEY: ${CURSEFORGE_API_KEY:?}

      DOMAIN_RATE_LIMITS: >-
        {
          "api.curseforge.com": { "capacity": 100, "refill_rate": 3 },
          "api.modrinth.com":   { "capacity": 100, "refill_rate": 3 }
        }

      SCHEDULE: >-
        {
          "curseforge-queue":      { "cron": "*/20 * * * *",     "args": "curseforge queue" },
          "modrinth-queue":        { "cron": "10,30,50 * * * *", "args": "modrinth queue" },
          "curseforge-refresh":    { "cron": "0 */2 * * *",      "args": "curseforge refresh" },
          "modrinth-refresh":      { "cron": "0 */2 * * *",      "args": "modrinth refresh" },
          "curseforge-search":     { "cron": "0 */2 * * *",      "args": "curseforge search" },
          "modrinth-search":       { "cron": "30 */2 * * *",     "args": "modrinth search" },
          "curseforge-categories": { "cron": "0 0 * * *",        "args": "curseforge categories" },
          "modrinth-tags":         { "cron": "0 0 * * *",        "args": "modrinth tags" },
          "modrinth-refresh-full": { "cron": "0 4 * * *",        "args": "modrinth refresh-full" }
        }

    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
